[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fritzlog"
version = "0.1.0"
description = "Containerised log collector for AVM Fritz!Box mesh networks"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fritzconnection>=1.14",
    "pyyaml>=6.0",
    "prometheus-client>=0.20",
]

[project.scripts]
fritzlog = "fritzlog.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.4",
    "types-pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = "fritzconnection.*"
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN", "B"]
